name: API Integration Tests

on:
  push:
    branches: [ feat/newman-api-test-pipeline ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      MONGO_USER: ${{ secrets.MONGO_USER }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Debug Environment
        run: |
          echo "JWT Secret is set: ${{ env.JWT_SECRET != '' }}"
          echo "Mongo User is set: ${{ env.MONGO_USER != '' }}"

      - name: Start Services
        run: docker compose -f docker-compose.test.yml up -d --build
        env:
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}

      - name: Wait for API (Seeding + Boot)
        run: npx wait-on -v http-get://127.0.0.1:3000/health --timeout 90000

      - name: Run Newman Tests
        run: |
          npm install newman newman-reporter-htmlextra
          mkdir -p newman

          ./node_modules/.bin/newman run ./tests/collection.json \
          -e ./tests/environment.template.json \
          --env-var "base_url=http://localhost:3000" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export ./newman/report.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Test-Report
          path: ./newman/report.html

      - name: Stop Services
        if: always()
        run: docker compose -f docker-compose.test.yml down