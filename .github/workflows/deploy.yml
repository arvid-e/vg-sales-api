name: Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd ~/vg-sales-api
          git pull origin main

      - name: Deploy with Docker Compose
        run: |
          cd ~/vg-sales-api
          docker compose up -d --build