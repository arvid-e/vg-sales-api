services:
  api:
    build: .
    restart: always
    env_file: .env
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=${MONGO_URI}

  mongodb:
    image: mongo:latest
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - ./webroot:/var/www/html
    depends_on:
      - api

volumes:
  certbot-etc:
  certbot-var:
  mongo-data: