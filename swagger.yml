openapi: 3.0.0
info:
  title: VG Sales API
  description: API for managing video game data and user accounts. Developed for Linnaeus University.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 65e1f1...
        username:
          type: string
          example: arvid_dev
    
    Game:
      type: object
      properties:
        gameId:
          type: string
        title:
          type: string
        platform:
          type: string
        genre:
          type: string
        links:
          type: object

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  token: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        400:
          description: Invalid input (e.g., password too short)

  /auth/login:
    post:
      summary: Log in a user
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        401:
          description: Authentication failed

  /games:
    get:
      summary: Get all games (Paginated)
      tags: [Games]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: List of games
    
  /users/{id}:
    delete:
      summary: Delete a user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: User deleted successfully
        404:
          description: User not found